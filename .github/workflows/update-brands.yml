name: Mise a jour des marques des stations

on:
  schedule:
    # Une fois par semaine (dimanche 3h UTC) : une marque change rarement,
    # inutile de solliciter l'API Overpass (infrastructure publique
    # partagee) aussi souvent que la collecte des prix.
    - cron: "0 3 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: maj-marques
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # La requete Overpass France entiere peut prendre plusieurs minutes
    # (observe jusqu'a ~3-4 min), avec repli sur plusieurs miroirs publics
    # si l'un d'eux est indisponible/surcharge.
    timeout-minutes: 30
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Recuperer les marques (OpenStreetMap) et regenerer le site
        run: |
          python3 fetch_brands.py
          python3 build_site.py

      - name: Committer et pousser les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marques.csv stations index.html comparaison.html
          if git diff --cached --quiet; then
            echo "Aucun changement de marque a enregistrer."
          else
            git commit -m "Mise a jour des marques des stations ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
